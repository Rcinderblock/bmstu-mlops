# Единственное место, где живёт имя модели.
# Менять модель под своё железо нужно ЗДЕСЬ, а не в коде.
model:
  name: "Qwen/Qwen3-0.6B"
  dtype: "bfloat16"
  device: "auto"            # auto | cpu | cuda | mps

generate:
  max_new_tokens: 200
  temperature: 0.0          # выбираем наиболее вероятный токен без случайного выбора
  seed: 42
  enable_thinking: false    # Qwen3 без этого отвечает <think>-блоком

bench:
  warmup_runs: 1            # прогрев не засчитывается в замер
  measure_runs: 3
  prompt: "Объясни, что такое MLOps, в трёх предложениях."

hooks:
  prompt: "Объясни, что такое MLOps, в трёх предложениях."
  plot: "docs/activations.png"

memory:
  # Один шаг forward+backward+optimizer на короткой последовательности.
  seq_len: 256
  batch_size: 1
  lr: 1.0e-5
  # Сколько раз повторить каждый режим (каждый прогон — отдельный процесс).
  # Берётся худший пик, число прогонов уходит в «Условия замера» отчёта:
  # цифра, снятая один раз, и медиана пяти — разные утверждения.
  repeats: 1
  sample_interval_seconds: 0.01

lora:
  alpha_ratio: 2            # lora_alpha = alpha_ratio * r
  dropout: 0.0
  # Первый конфиг используется ещё и в замере памяти.
  configs:
    - name: "r=8, q_proj+v_proj"
      r: 8
      target_modules: ["q_proj", "v_proj"]
    - name: "r=16, все линейные"
      r: 16
      target_modules: ["q_proj", "k_proj", "v_proj", "o_proj",
                       "gate_proj", "up_proj", "down_proj"]

report:
  json: "docs/report.json"
  markdown: "docs/anatomy.md"
