    params:
      params.yaml:
        collect:
          version: v1
          source_manifest: conf/source.json
          sources:
            v1:
            - data/source/massive-ru-RU.jsonl
            v2:
            - data/source/massive-ru-RU.jsonl
          partitions:
            v1:
            - train
            v2:
            - train
            - dev
            - test
          locale: ru-RU
          scenarios:
          - calendar
          - lists
          - alarm
          min_intent_votes: 2
          exclude_user_pattern: (?i)таймер
          labels:
            alarm_set: поставить будильник
            alarm_query: посмотреть будильники
            alarm_remove: удалить будильник
            calendar_set: создать событие или напоминание
            calendar_query: посмотреть календарь
            calendar_remove: удалить событие
            lists_createoradd: создать список или добавить пункт
            lists_query: посмотреть список
            lists_remove: удалить список или пункт
          system_prompts:
          - Определи действие для личного планировщика. Верни только одну метку
            из списка без пояснений.
          - Разбери русскую команду о календаре списках или будильнике. Ответь
            только подходящей меткой.
          - Выбери намерение пользователя из разрешённых меток. Не выполняй
            команду и не добавляй объяснений.
          - Ты классифицируешь запросы к планировщику. Выведи одну метку
            действия без дополнительного текста.
        paths.metrics_collect: metrics/collect.json
        paths.raw: data/raw.jsonl
    outs:
    - path: data/raw.jsonl
      hash: md5
      md5: 5620469e1283a74b9edad3bd47cb1efe
      size: 2514368
    - path: metrics/collect.json
