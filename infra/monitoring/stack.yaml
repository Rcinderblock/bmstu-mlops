apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: mlops-hw11
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: prometheus
  namespace: mlops-hw11
rules:
- apiGroups:
  - ''
  resources:
  - pods
  verbs:
  - get
  - list
  - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: prometheus
  namespace: mlops-hw11
subjects:
- kind: ServiceAccount
  name: prometheus
  namespace: mlops-hw11
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: prometheus
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: mlops-hw11
data:
  prometheus.yaml: "global:\n  scrape_interval: 5s\n  evaluation_interval: 5s\nrule_files:\
    \ [/etc/prometheus/alerts.yaml]\nscrape_configs:\n- job_name: planner-pods\n \
    \ kubernetes_sd_configs:\n  - role: pod\n    namespaces: {names: [mlops-hw11]}\n\
    \  relabel_configs:\n  - source_labels: [__meta_kubernetes_pod_label_app]\n  \
    \  action: keep\n    regex: planner\n  - source_labels: [__meta_kubernetes_pod_container_port_name]\n\
    \    action: keep\n    regex: http\n  - source_labels: [__meta_kubernetes_pod_name]\n\
    \    target_label: pod\n"
  alerts.yaml: "groups:\n- name: planner\n  rules:\n  - alert: PlannerLatency\n  \
    \  expr: histogram_quantile(0.95, sum by (le) (rate(planner_ttfc_seconds_bucket[30s])))\
    \ > 0.6 and sum(increase(planner_ttfc_seconds_count[30s])) >= 20\n    for: 10s\n\
    \    labels: {severity: warning}\n    annotations: {summary: 'TTFC p95 >0.6s,\
    \ at least 20 first chunks /30s'}\n  - alert: PlannerRejects\n    expr: sum(rate(planner_requests_total{outcome=~\"\
    rejected|unready|interrupted\"}[30s])) / sum(rate(planner_requests_total[30s]))\
    \ > 0.05 and sum(increase(planner_requests_total[30s])) >= 20\n    for: 10s\n\
    \    labels: {severity: warning}\n    annotations: {summary: 'Reject/interruption\
    \ fraction >5%, at least 20 outcomes /30s'}\n"
---
